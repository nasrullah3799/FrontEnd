<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

        <title>label and input</title>
    </head>
    <body class="p-3 m-4 bg-green-100">
        <label for="name" class="">Name </label>
        <input type="text" id="name" name="name" required minlength="4" maxlength="5" size="10" /> <br />
        <label for="age">Age </label>
        <input type="text" id="age" name="age" required minlength="4" maxlength="8" size="10" /><br />

        <label for="avatar">Choose a profile picture:</label>
        <input type="file" id="avatar" name="avatar" accept="image/png, image/jpeg" />
        <input type="range" min="0" max="100" />
    </body>
</html>
